<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Decode Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1C2E;
  --teal:#0D7377;--teal2:#3BAAB0;--teal-lt:#DFF2F3;--teal-dk:#0A5C60;
  --coral:#C44B1C;--coral-lt:#FAEAE3;
  --indigo:#4A35A0;--indigo-lt:#ECEAF8;
  --dark:#1A1A2E;--mid:#5A6678;--light:#F4F6F8;--white:#FFFFFF;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#d8dde2;-webkit-font-smoothing:antialiased}

.top-bar{background:var(--dark);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.top-bar-brand{font-weight:900;color:var(--teal2);font-size:1rem;letter-spacing:.04em}
.btn-pdf{padding:9px 22px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;letter-spacing:.03em}
.btn-pdf:hover{background:var(--teal-dk)}

.print-page{width:210mm;min-height:297mm;background:#fff;margin:16px auto;position:relative;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,.18);display:flex;flex-direction:column}

/* ── COVER ── */
.cover{background:var(--navy);min-height:297mm;display:flex;flex-direction:column;position:relative}
.cover-art{position:absolute;top:40px;left:0;right:0;height:56%;opacity:.5;pointer-events:none}
.cover-content{margin-top:auto;position:relative;z-index:2;padding:0 52px 28px}
.cover-label{font-size:.7rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--teal2);margin-bottom:22px}
.cover-name{font-size:3.6rem;font-weight:900;line-height:1.02;letter-spacing:-.5px;color:#fff;margin-bottom:18px}
.cover-meta{font-size:.75rem;color:rgba(255,255,255,.4);letter-spacing:.04em}
.cover-footer{background:#fff;display:flex;align-items:center;gap:28px;padding:18px 40px}
.cover-footer-brand{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal2);margin-bottom:2px}
.cover-footer-tagline{font-size:.68rem;color:rgba(255,255,255,.5);line-height:1.4}
.cb{position:absolute;width:32px;height:32px;border-color:rgba(255,255,255,.25);border-style:solid}
.cb-tl{top:26px;left:34px;border-width:2px 0 0 2px}
.cb-tr{top:26px;right:34px;border-width:2px 2px 0 0}

/* ── RUNNING HEADER ── */
.run-hdr{display:flex;justify-content:space-between;align-items:center;padding:11px 40px;border-bottom:1px solid #e2eaec;font-size:.58rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mid)}

/* ── PERFORMANCE LEAD ── */
.perf-intro{background:var(--navy);padding:15px 40px 14px}
.perf-intro-eyebrow{font-size:.57rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.perf-intro-title{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:6px}
.perf-intro-text{font-size:.73rem;color:rgba(255,255,255,.65);line-height:1.56}
.perf-lead-band{background:#EDF6F7;border-bottom:1px solid #C8E2E4;padding:11px 40px}
.perf-lead-eyebrow{font-size:.57rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);margin-bottom:7px}
.perf-lead-pills{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.perf-lead-pill{padding:5px 16px;border-radius:4px;font-size:.82rem;font-weight:700;color:#fff}
.perf-lead-text{font-size:.71rem;color:#3A4A54;line-height:1.5}
.perf-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 40px 0}
.perf-card{border-radius:6px;padding:13px 15px}
.perf-card.core-card{background:#EFF3F6}
.perf-card.flow-card{background:#E6F4F4}
.perf-card-label{font-size:.57rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:2px}
.perf-card-title{font-size:.92rem;font-weight:800;color:var(--dark);margin-bottom:8px}
.perf-card-wheel{display:flex;justify-content:center;margin-bottom:8px}
.perf-card-order{font-size:.66rem;text-align:center;margin-bottom:7px;line-height:1.7}
.perf-card-intro{font-size:.71rem;line-height:1.56;color:var(--dark)}
.perf-order-section{padding:10px 40px 12px}
.perf-order-label{font-size:.57rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
.perf-order-row-label{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.perf-order-gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.gauge-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge-name{font-size:.63rem;font-weight:700;color:var(--dark);text-align:center}
.gauge-pos{font-size:.56rem;color:#8A9BA0;text-align:center}

/* ── WORK WITH ME ── */
.wwm-hdr{background:var(--navy);padding:18px 40px 14px;margin-bottom:14px}
.wwm-hdr-title{font-size:1.35rem;font-weight:900;color:#fff;margin-bottom:5px}
.wwm-hdr-sub{font-size:.74rem;color:rgba(255,255,255,.6)}
.wwm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 40px}
.wwm-cell{padding:15px;background:#FAFAFA;overflow:hidden}
.wwm-cell-rule{height:3px;margin:-15px -15px 12px;background:var(--teal)}
.wwm-cell-rule.coral{background:var(--coral)}
.wwm-cell-rule.indigo{background:var(--indigo)}
.wwm-cell-title{font-size:.59rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.wwm-cell-title.coral{color:var(--coral)}
.wwm-cell-title.indigo{color:var(--indigo)}
.wwm-item{font-size:.74rem;line-height:1.52;margin-bottom:6px;color:var(--dark);padding-bottom:5px;border-bottom:1px solid #EAEAEA}
.wwm-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

/* ── CHAPTER DIVIDER ── */
.ch-div{min-height:297mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:56px 64px;position:relative;overflow:hidden}
.ch-div.ch-teal{background:var(--teal)}
.ch-div.ch-coral{background:var(--coral)}
.ch-div.ch-indigo{background:var(--indigo)}
.ch-ghost{position:absolute;font-size:290px;font-weight:900;color:rgba(255,255,255,.12);line-height:1;pointer-events:none;bottom:50px;left:0;right:0;text-align:center;letter-spacing:-8px}
.ch-eyebrow{font-size:.62rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:14px}
.ch-name{font-size:4rem;font-weight:900;color:#fff;line-height:1;margin-bottom:16px}
.ch-rule{width:64px;height:2px;background:rgba(255,255,255,.45);margin:0 auto 16px}
.ch-tagline{font-size:.92rem;color:rgba(255,255,255,.8);line-height:1.55}
.ch-chips{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:0 48px;flex-wrap:wrap}
.ch-chip{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 14px;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* ── CONTENT PAGE ── */
.content-page{flex:1;padding:16px 40px 0;display:flex;flex-direction:column}
.sec-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:5px}
.sec-icon-box{width:46px;height:46px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;color:#fff;font-style:normal;line-height:1}
.sec-icon-box.teal{background:var(--teal)}
.sec-icon-box.coral{background:var(--coral)}
.sec-icon-box.indigo{background:var(--indigo)}
.sec-hdr-text .sec-title{font-size:1.08rem;font-weight:800;color:var(--dark)}
.sec-hdr-text .sec-desc{font-size:.73rem;color:var(--mid);font-style:italic;line-height:1.5;margin-top:3px}
.sec-instruction{font-size:.72rem;color:var(--mid);font-style:italic;margin:8px 0 10px}

/* two-col stmt grid */
.stmt-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-content:stretch;margin:0}
.stmt-item{display:flex;gap:8px;align-items:center;font-size:.75rem;line-height:1.52;color:var(--dark);padding:10px 8px;border-bottom:1px solid #EEF1F3}
.stmt-dot{flex-shrink:0;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.82rem;color:#fff;margin-top:0}
.stmt-dot.teal{background:var(--teal)}
.stmt-dot.coral{background:var(--coral)}
.stmt-dot.indigo{background:var(--indigo)}

/* rebalancers */
.reb-box{background:#FFFBF0;border:1px solid #E8C87A;border-radius:5px;padding:10px 13px 10px 30px;font-size:.75rem;line-height:1.52;font-style:italic;position:relative;margin-bottom:5px;color:var(--dark)}
.reb-box::before{content:'\201C';position:absolute;left:9px;top:5px;font-size:1.3rem;color:#C8A030;font-style:normal;line-height:1}

/* pressure points */
.pp-warn-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;align-content:stretch}
.pp-warn-card{background:#FFF8F0;border:1px solid #F5C97A;border-radius:4px;padding:7px 10px;font-size:.72rem;line-height:1.45;display:flex;gap:6px}
.pp-consider{background:var(--teal-lt);border-radius:4px;padding:7px 10px;display:flex;gap:9px;align-items:flex-start;font-size:.72rem;line-height:1.45;margin-bottom:4px}
.pp-consider-tag{flex-shrink:0;font-size:.57rem;font-weight:800;text-transform:uppercase;color:var(--teal);width:46px;padding-top:1px}

/* decision making */
.dm-para{background:#F7F9FA;border-left:3px solid var(--indigo);border-radius:0 4px 4px 0;padding:10px 12px;font-size:.74rem;line-height:1.58;margin-bottom:10px;color:var(--dark)}
.q-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:stretch}
.q-item{background:var(--light);border-radius:4px;padding:7px 10px;font-size:.72rem;line-height:1.45;color:var(--dark)}

/* blind spot */

/* blind spot hdr */
.blind-spot-hdr{background:#FFF4F0;border:1px solid #F0D0C0;border-radius:5px;padding:10px 14px;margin-bottom:8px}
.blind-spot-hdr-lbl{font-size:.57rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.blind-spot-pills{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.blind-spot-hdr-desc{font-size:.7rem;color:var(--dark);line-height:1.45}
.blind-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:stretch}
.blind-item{background:#FFF8F0;border-left:3px solid var(--coral);border-radius:0 4px 4px 0;padding:7px 10px;font-size:.72rem;line-height:1.45;color:var(--dark)}

/* resilience */
.res-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:stretch;margin-bottom:0}
.res-col{border-radius:4px;padding:10px 12px;display:flex;flex-direction:column}
.res-col.setback{background:#F0F4F8}
.res-col.success{background:#F0F8F2}
.res-col-title{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.res-col.setback .res-col-title{color:#5A7090}
.res-col.success .res-col-title{color:#3A7050}
.res-item{flex:1;font-size:.72rem;line-height:1.45;margin-bottom:4px;padding-left:8px;padding-top:4px;padding-bottom:4px;border-left:2px solid rgba(0,0,0,.1);color:var(--dark)}
.proactive-item{background:var(--indigo-lt);border-left:3px solid var(--indigo);border-radius:0 4px 4px 0;padding:7px 10px;font-size:.72rem;line-height:1.45;margin-bottom:4px;color:var(--dark)}

/* energisers */
.drain-item{background:#FFF3E0;border:1px solid #F5C97A;border-radius:4px;padding:6px 10px;font-size:.72rem;line-height:1.45;margin-bottom:4px;color:var(--dark)}
.en-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:stretch}
.en-col{border-radius:4px;padding:10px 12px;display:flex;flex-direction:column}
.en-col.recharge{background:var(--teal-lt)}
.en-col.expand{background:var(--indigo-lt)}
.en-col-title{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.en-col.recharge .en-col-title{color:var(--teal)}
.en-col.expand .en-col-title{color:var(--indigo)}
.en-item{flex:1;font-size:.72rem;line-height:1.45;padding-top:4px;padding-bottom:4px;margin-bottom:4px;padding-left:8px;border-left:2px solid rgba(0,0,0,.08);color:var(--dark)}

/* confidence */
.voice-box{background:var(--indigo-lt);border-top:3px solid var(--indigo);padding:10px 14px;margin-bottom:10px}
.voice-lbl{font-size:.57rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--indigo);margin-bottom:4px}
.voice-text{font-size:.85rem;font-style:italic;color:var(--dark);line-height:1.45;font-weight:600}
.conf-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;align-content:stretch}
.conf-item{background:var(--light);border-radius:4px;padding:7px 10px;font-size:.72rem;line-height:1.45;color:var(--dark)}
.expand-item{background:var(--indigo-lt);border-left:3px solid var(--indigo);border-radius:0 4px 4px 0;padding:7px 10px;font-size:.72rem;line-height:1.45;margin-bottom:4px;color:var(--dark)}

/* drivers */
.drivers-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:stretch}
/* decoding decisions */
.dd-section-lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mid);margin:16px 0 6px}
.dd-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dd-card{border-radius:5px;overflow:hidden}
.dd-card-hdr{padding:8px 10px;color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.dd-card-body{background:#F7F9FA;padding:8px 10px}
.dd-card-q{font-size:.7rem;font-style:italic;color:var(--dark);line-height:1.45;margin-bottom:10px}
.dd-card-lines{border-bottom:1px solid #D8DDE3;margin-bottom:7px;height:0}

/* summary page */
.summ-hdr{background:var(--navy);padding:22px 40px 18px}
.summ-hdr-eyebrow{font-size:.57rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.summ-hdr-name{font-size:2rem;font-weight:900;color:#fff;margin-bottom:12px;line-height:1.1}
.summ-hdr-lead-lbl{font-size:.57rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:7px}
.summ-hdr-pills{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.summ-hdr-desc{font-size:.71rem;color:rgba(255,255,255,.6);line-height:1.5}
.summ-section{border-radius:6px;overflow:hidden;border:1px solid #E2EAF0;display:flex;flex-direction:column}
.summ-sec-hdr{padding:10px 16px;display:flex;align-items:center;gap:10px}
.summ-sec-hdr.core-hdr{background:var(--indigo-lt);border-bottom:1px solid #D0C8EC}
.summ-sec-hdr.flow-hdr{background:var(--teal-lt);border-bottom:1px solid #C0DDE0}
.summ-sec-eyebrow{font-size:.57rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.summ-sec-title{font-size:.88rem;font-weight:800;color:var(--dark)}
.summ-sec-body{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:20px;flex:1}
.summ-sec-wheel{flex-shrink:0}
.summ-sec-text{font-size:.72rem;color:var(--dark);line-height:1.55}

/* back page */
.back-page{background:#fff;min-height:297mm;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 52px}
.back-art{position:absolute;top:0;left:0;right:0;height:55%;opacity:.18;pointer-events:none}
.back-title{font-size:1rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);margin-bottom:6px;text-align:center}
.back-copy{font-size:.62rem;color:#8A9BA0;text-align:center}

.driver-item{background:var(--light);border-radius:4px;padding:7px 10px;font-size:.72rem;line-height:1.45;color:var(--dark)}

/* coaching prompt */
.coaching-prompt{border-left:4px solid var(--teal);background:#F8FAFC;border-top:1px solid #DDE8EC;padding:12px 16px 12px 40px;display:flex;gap:14px;align-items:flex-start}
.cp-label{font-size:.55rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);flex-shrink:0;width:66px;padding-top:2px;line-height:1.3}
.cp-q{font-size:.78rem;font-style:italic;color:var(--dark);line-height:1.5}

/* page footer */
.page-footer{padding:7px 40px;border-top:1px solid #E8EEF0;display:flex;justify-content:space-between;align-items:center;font-size:.55rem;color:#9AAAB4;background:#fff}

/* sub-labels */
.sub-lbl{font-size:.7rem;color:var(--mid);font-style:italic;margin-bottom:6px;margin-top:8px}

/* loading */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--mid);background:#fff;max-width:210mm;margin:20px auto}

/* ── PRINT ── */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .print-page{width:210mm;height:297mm;min-height:unset;margin:0;box-shadow:none;page-break-after:always;overflow:hidden;display:flex;flex-direction:column}
  .print-page:last-child{page-break-after:auto}
  .cover,.ch-div,.perf-intro,.perf-lead-band,.perf-card,.sec-icon-box,.stmt-dot,
  .run-hdr,.coaching-prompt,.wwm-cell,.wwm-hdr,.perf-order-section,
  .pp-warn-card,.pp-consider,.reb-box,.voice-box,.en-col,.res-col,
  .drain-item,.proactive-item,.expand-item,.conf-item,.driver-item,
  .q-item,.blind-item,.dm-para,.dd-card-hdr,.summ-hdr,.summ-sec-hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

erence and deliberate by nature — and the combination produces work that is consistently reliable.','Energised':'Measured and methodical in how you engage, you also bring a drive that means your analysis doesn\'t stay theoretical for long. You think carefully and then you act with real conviction — and people experience you as someone who earns their boldness through the quality of their preparation.'},

an scattered. You know when to lean in and when to hold back, and this selectivity tends to make the connections you do make particularly strong.','Energised':'Energised by people and connection, you also bring a drive and ambition that gives your social energy real purpose. You don\'t just connect — you move things forward through those connections, and people experience you as someone who combines warmth with momentum.'},

wer to validate what others are experiencing','Sometimes people need you to be more alarmed than you feel — not to perform concern, but to show you understand the stakes'],Resilience:{setback:['You tend to appear even-tempered following a setback — showing little visible reaction despite what you might be feeling internally','You\'re likely to take time to reflect quietly rather than reacting immediately or expressing your response outwardly','You process setbacks privately, returning with a steady re-approach rather than needing to work through it in public'],success:['Following a success, you tend to respond calmly — the emotional high doesn\'t tend to linger for long','You\'re likely to move fairly quickly to the next task rather than spending much time in celebration','Your groundedness after a success helps those around you stay focused rather than getting carried away'],proactive:['Give yourself permission to share how a setback has actually affected you — the people who care about you want to know','After a success, take a moment to genuinely mark it — even if quietly. You\'re allowed to feel good about what you\'ve achieved.','Beware the pattern of appearing fine when you\'re not — the people who can support you most need to know when to show up']},Drivers:['Stability, consistency, and the sense of doing solid, dependable work over time','The satisfaction of performing reliably when others around you are finding things difficult','Being genuinely trusted — not just respected — by the people you work with','Environments where your steadiness is clearly seen as an asset rather than a limitation','The sense that your measured judgement is making a genuine difference, even if it doesn\'t always get the credit','Clear expectations and the space to deliver against them without artificial urgency','Relationships and roles where your consistency has been earned and is valued over time','Work that is meaningful enough to warrant the careful, considered investment you more manageable for those around you','Clarity about what you are genuinely confident about — not everything, but the things that matter most'],expand:['Build confidence in your ability to respond to emotional situations, not just practical ones','Practise asking for support or input before you\'ve fully resolved something on your own','Seek evidence that visibility and expression of your engagement — not just its substance — has made a difference']}},
'Open':{'Stress Triggers':['Rigidity and excessive process that leaves no room for fresh thinking or adaptation','Being micromanaged, or having ideas dismissed before they\'ve been properly explored','Environments where deviation from the norm is treated as a problem rather than a possibility','Being locked into a role with no room for growth or development','Sustained boredom — when there is nothing new to engage with or learn from','Having creative ideas shut down without genuine consideration','Being expected to repeat the same approach when you can see a better way','Environments where conformity is valued more than curiosity','Working in teams where the default response to something new is "we\'ve always done it this way"','Feeling that your adaptability is read as unreliability rather than a strength'],'Pressure Points':{warnings:['Scattering energy across too many things at once as a way of managing uncertainty','Moving quickly between options without committing to any of them','Focusing on what could go right rather than addressing what needs fixing now','Retreating into optimism to avoid a necessary but difficult conversation','Starting new things before finishing what\'s already in progress','Becoming restless in situations that require sustained focus and repetition','Taking on too much because everything seems interesting in the moment','Seeking novelty as a distraction from a problem that needs to be sat with'],consider:[['Firm','What needs to be decided right now — and what would it take to commit to it?'],['Reserved','What\'s the risk if this doesn\'t land? What would a more cautious approach look like?'],['Composed','What would it look like to slow down and settle on one thing before moving forward?']]},'Decision Making':{para:'You tend to make decisions by exploring the landscape of options rather than converging quickly on a single answer. You\'re at your best when the question is genuinely open and where creative thinking adds real value. Your risk is in keeping options open past the point where a decision is needed, or returning to settled decisions when something new captures your attention.',questions:['If you had to decide right now, without any more information, what would you choose — and why haven\'t you?','What\'s the simplest version of a good enough decision here?','What would someone who rarely changes their mind do in this situation?','Which options have you already explored that were good enough — and why haven\'t you committed to one?','What are you genuinely uncertain about, versus what are you just finding more interesting to explore?','If this decision needed to be made in the next ten minutes, what would you do?','What would a more risk-aware perspective see that you might be minimising?','What would it cost you to commit to one path and let the others go?']},'Blind Spot':['You may not always appreciate how unsettling your appetite for change is for others who need more predictability','Your optimism can shield you — and those around you — from a risk that needs to be taken seriously','Others may experience your openness to new ideas as a lack of commitment to what was already decided','The pace at which you move on from things can leave others feeling unheard or undervalued','Your enthusiasm for what\'s possible can crowd out the voice that says: "but what about this problem?"','It\'s worth noticing when your preference for exploration is a way of delaying a decision you\'d rather not make','Colleagues with a different preference may experience your adaptability as unpredictability','Starting things well and losing momentum is a pattern worth being honest with yourself about','You may assume others share your comfort with ambiguity — many don\'t, and need more certainty than you provide','Optimism is a genuine strength, but it can prevent you giving a concern the attention it deserves'],Resilience:{setback:['You tend to reframe setbacks as information rather than failure, finding the next 'Reserved':{'Stress Triggers':['Ambiguity and lack of clarity about what\'s expected, what success looks like, or what\'s coming next','Being pushed to commit or perform at short notice, before you\'ve had adequate time to prepare','Environments where corners are routinely cut or quality is consistently sacrificed for speed','Unexpected change — particularly when it undermines careful preparation you\'ve already done','Cultures where planning and preparation are seen as excessive rather than valuable','Having to operate in high-exposure situations without the preparation time that would settle you','Being asked to go first in a group before you\'ve had time to form and test your view','Situations where the full picture isn\'t available and you\'re expected to act as though it is','Environments where your caution is read as timidity rather than sound judgement','Being overruled on a risk you had flagged and seen clearly — particularly when it turns out you were right'],'Pressure Points':{warnings:['Your threat sensitivity can amplify, causing you to perceive risk where others see a manageable situation','Becoming more self-critical under pressure, holding your own performance to a standard that is no longer helpful','Withdrawing into analysis as a way of feeling in control when what\'s actually needed is a decision','Heightened vigilance that is genuinely exhausting to sustain over time','Analysis paralysis — not because you can\'t see the answer, but because no option feels sufficiently safe','Over-preparing to the point where it delays action rather than enabling it','A growing sense that everything is at risk, even when the actual exposure is relatively contained','Becoming harder to engage with as you manage your own internal experience'],consider:[['Outgoing','What if you shared where you are right now — not the final answer, just the thinking?'],['Energised','What\'s the smallest step forward you could take today, before everything is perfectly in place?'],['Open','What\'s the best possible outcome here — and what would it take for you to actually pursue it?']]},'Decision Making':{para:'You are a careful, thorough decision-maker — you weigh options diligently and are attuned to the potential downsides of each course of action. Your decisions tend to be well-considered and rarely regretted for being rushed. Your challenge is in situations where a good-enough decision made quickly is more valuable than a perfect decision made late — and in distinguishing between the risks worth managing carefully and those that are simply inherent in moving forward.',questions:['What\'s the best possible outcome here — and have you considered it as carefully as the risks?','What would happen if you made a decision right now, based on what you already know?','What is the cost of not deciding — and have you been as honest about that as you\'ve been about the cost of deciding?','Is the preparation you\'re doing reducing the real risk, or reducing the feeling of risk?','What\'s the minimum information you\'d need to make a confident enough decision?','If you had to commit to one path in the next hour, which would it be — and why?','What would someone less cautious than you notice about this situation that you might be missing?','When have you taken a risk that felt uncomfortable — and how often did it actually go wrong?']},'Blind Spot':['Your caution can appear to others as hesitancy or lack of confidence, rather than the careful judgement it actually is','Your risk-awareness can produce a more conservative position than the evidence actually requires','You may be limiting possibilities that are genuinely worth exploring because the discomfort of uncertainty feels disproportionate','People around you may not know how much work you\'ve done, because you tend to present conclusions rather than process','Your preference for preparation can occasionally be read as stalling — even when it isn\'t','The risk you identify most clearly is always the downside — your awareness of upside potential may be less acute','When you advocate for caution, others may hear "I don\'t believe in this" rather than "I want to make sure we\'ve thought it through"','You may underestimate how reassuring your calm, thorough presence is to others — and undersell yourself as a result','Your internal experience of risk is often more intense than the situation warrants — and calibrating that gap is valuable','Some of the risks you plan carefully to avoid never actually materialise — and you don\'t always stop to notice that'],Resilience:{setback:['Following a setback, you tend to reflect thoroughly and carefully on what happened before taking any next step','You\'re likely to move through a setback quietly and internally — processing it alone rather than talking it through','You\'re rarely caught entirely off guard — your preparation means you\'ve often considered the possibility already'],success:['Following a success, you tend to stay grounded and humble rather than getting carried away','You may question whether the success was as complete as it appeared, or worry about what could still go wrong','Your awareness of what could have gone differently tends to outlast the satisfaction of what went right'],proactive:['Distinguish between setbacks that confirmed a genuine risk and those that were simply unforeseeable — they\'re different things','Allow yourself to fully mark a success before interrogating it — you\'ve earned the right to sit in it for a moment','Beware the pattern of treating every setback as confirmation of your fears — not every difficult outcome was predictable']},Drivers:['Security, quality, and the satisfaction of having prepared thoroughly and delivered dependably','Knowing that nothing has been left to chance that didn\'t need to be','Environments where conscientiousness is genuinely valued and quality is not sacrificed for speed','The comfort of clarity — knowing what\'s expected, what success looks like, and what the boundaries are','Trust that is earned over time through consistency, not demanded up front','The sense of having done the work properly — not for recognition, but because it matters to you','Environments where your level of preparation and risk-awareness is valued, not managed around','Relationships where you feel safe to raise a concern without being told you\'re overthinking','Work with enough structure to allow you to prepare adequately and enough meaning to make that preparation worthwhile','The satisfaction of being right about something you\'d noticed and flagged — particularly when it\'s made a genuine difference'],Energisers:{drains:['Working in environments where corners are routinely cut and your standards feel constantly under pressure','Exposure to high-ambiguity situations where the rules keep changing and adequate preparation isn\'t possible'],recharge:['Give yourself genuine preparation time before something high-stakes — don\'t let others take it from you','Spend time in environments where the standards match your own — they restore rather than drain you','Allow yourself to settle into something familiar when you\'ve been stretched — routine can be restorative','Invest in relationships where you feel safe to express your concerns without being told you\'re worrying unnecessarily','Mark what went well — not just what you\'d do differently next time'],expand:['Practise taking one step forward before everything is perfectly in place — notice it rarely goes as wrong as you feared','Build relationships with people whose confidence in the face of ambiguity you trust and can learn from','Set yourself a challenge that requires you to act on incomplete information — use it as data about your own range','Distinguish between the risks you need to manage and the discomfort you simply need to tolerate','Find your version of "good enough to proceed" — not as a lowered standard, but as a practical one']},Confidence:{inner_voice:'"What if I get this wrong — and it e people feel they can never quite keep up','What you experience as healthy ambition may feel, to others, like an impossible standard','The relationship between your effort and the eventual outcome is not always as direct as it feels from the inside'],Resilience:{setback:['Setbacks tend to activate rather than deflate you — your instinct is to respond with increased determination','You\'re likely to reframe a setback quickly and move back into pursuit mode faster than most people around you','You rarely stay down for long — your natural orientation is towards what you can control and what you can do next'],success:['Following a success, you\'re likely to be energised and immediately focused on the next challenge','You may move on from a win before you\'ve fully allowed yourself — or those around you — to mark it properly','Your bar tends to shift upward after a success rather than stabilising — which keeps you moving but can make satisfaction elusive'],proactive:['Recognise when what\'s needed is recovery rather than redoubling of effort — your performance genuinely depends on it','After a success, take a moment to celebrate with the people around you before moving to the next thing','Build recovery deliberately into your rhythm — not as a reward for output, but as a condition for sustaining it']},Drivers:['Achievement, progress, and the sense of competing and winning — whether against others or against your own previous best','The feeling of forward movement — of getting closer to something that genuinely matters','Ambitious goals that stretch you and environments that set high standards and mean them','Clear measures of progress — knowing where you stand and how you\'re performing against what matters','Recognition of achievement from people whose opinion you genuinely respect','The autonomy to pursue outcomes in your own way, at your own pace, without unnecessary interference','Roles and environments where effort is visibly connected to outcomes','The sense that al energy and high performance — when your body and mind are in their best state, your confidence follows','The experience of having overcome something difficult through sheer determination and effort','Environments where the measure of performance is clear, visible, and you\'re performing well against it'],expand:['Build confidence in your ability to achieve at a sustainable pace, not just a punishing one','Seek evidence that the quality of your relationships — not just your results — is a genuine source of strength','Practise trusting others to carry part of the load — your confidence doesn\'t have to rest on doing everything yourself']}},

function nodeArt(){
  const nodes=[[50,60],[160,28],[290,75],[205,145],[95,185],[330,158],[430,58],[385,182],[255,265],[455,200],[148,282]];
  const links=[[0,1],[1,2],[2,3],[3,4],[4,0],[2,5],[5,6],[6,7],[7,5],[3,5],[5,8],[8,9],[9,7],[8,10],[10,4],[1,3]];
  const lines=links.map(([a,b])=>`<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}" stroke="#3BAAB0" stroke-width="1.2" stroke-opacity=".9"/>`).join('');
  const dots=nodes.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${[0,5].includes(i)?5.5:3}" fill="#3BAAB0" opacity="${[0,5,9].includes(i)?1:.6}"/>`).join('');
  return`<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">${lines}${dots}</svg>`;
}

function pieWheel(types,colors,leadType,size=140){
  const n=types.length,angle=360/n,cx=size/2,cy=size/2,r=size/2-2;
  const fs=Math.max(4.5,size/24);
  const cr=Math.round(size/7.5);
  let paths='';
  types.forEach((t,i)=>{
    const a0=(i*angle-90)*Math.PI/180,a1=((i+1)*angle-90)*Math.PI/180;
    const x1=cx+r*Math.cos(a0),y1=cy+r*Math.sin(a0),x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
    const isLead=t===leadType;
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${colors[t]}" opacity="${isLead?1:.4}"/>`;
    const am=((i+.5)*angle-90)*Math.PI/180,lr=r*.64;
    const lx=cx+lr*Math.cos(am),ly=cy+lr*Math.sin(am);
    paths+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="${fs.toFixed(1)}" font-weight="800" font-family="system-ui,sans-serif">${esc(t)}</text>`;
  });
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${paths}<circle cx="${cx}" cy="${cy}" r="${cr}" fill="white"/></svg>`;
}

function typeOrder(types,lead,secondary){
  const rest=types.filter(t=>t!==lead&&t!==secondary);
  return[lead,secondary,...rest].filter(Boolean);
}

function semiGauge(typeName,rank,color){
  // rank: 0=Lead, 1=2nd, 2=3rd, 3=Blind spot
  const gw=72,gh=52,gcx=36,gcy=46,gr=28;
  // Dot angle: rank 0 (Lead) = upper right, rank 3 (Blind) = upper left
  // range from pi/8 (22.5deg, upper right) to 7pi/8 (157.5deg, upper left)
  const theta=Math.PI/8+(rank/3)*(3*Math.PI/4);
  // SVG coords: x=cx+r*cos(theta), y=cy-r*sin(theta)
  const dotX=gcx+gr*Math.cos(theta);
  const dotY=gcy-gr*Math.sin(theta);
  const isBlind=rank===3;
  const dotFill=isBlind?'#C0CDD2':color;
  const nameColor=isBlind?'#9AAAB4':color;
  const posLabels=['Lead','2nd','3rd','Blind spot'];
  return`<div class="gauge-item">
    <svg width="${gw}" height="${gh}" viewBox="0 0 ${gw} ${gh}" xmlns="http://www.w3.org/2000/svg">
      <path d="M ${gcx-gr},${gcy} A ${gr},${gr} 0 0,1 ${gcx+gr},${gcy}" fill="none" stroke="#D4E0E4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${dotX}" cy="${dotY}" r="5" fill="${dotFill}"/>
    </svg>
    <div class="gauge-name" style="color:${nameColor}">${esc(typeName)}</div>
    <div class="gauge-pos">${posLabels[rank]}</div>
  </div>`;
}

function page(extraClass,content){
  return`<div class="print-page${extraClass?' '+extraClass:''}">${content}</div>`;
}

function perfLeadPage(lF,lC,secF,secC,fOrder,cOrder,flowIntro,coreIntro){
  const fWheel=pieWheel(FLOW_TYPES,FLOW_COLORS,lF,140);
  const cWheel=pieWheel(CORE_TYPES,CORE_COLORS,lC,140);

  // type order string with colored names
  const orderStr=(order,colors,lead)=>order.map(t=>{
    const c=t===lead?colors[t]:'#6A7A84';
    const w=t===lead?700:400;
    return`<span style="color:${c};font-weight:${w}">${esc(t)}</span>`;
  }).join(' <span style="color:#9AAAB4"> · </span> ');

  const cOrderStr=orderStr(cOrder,CORE_COLORS,lC);
  const fOrderStr=orderStr(fOrder,FLOW_COLORS,lF);

  // gauge rows
  const cGauges=cOrder.map((t,i)=>semiGauge(t,i,CORE_COLORS[t])).join('');
  const fGauges=fOrder.map((t,i)=>semiGauge(t,i,FLOW_COLORS[t])).join('');

  // lead pills (CORE first, then FLOW to match PDF)
  const cPill=`<span class="perf-lead-pill" style="background:${CORE_COLORS[lC]}">${esc(lC)}</span>`;
  const fPill=`<span class="perf-lead-pill" style="background:${FLOW_COLORS[lF]}">${esc(lF)}</span>`;

  return page('',`
    <div class="run-hdr"><span>Decode Profile&nbsp;·&nbsp;Confidential</span></div>
    <div class="perf-intro">
      <div class="perf-intro-eyebrow">Before you begin</div>
      <div class="perf-intro-title">Understanding your Performance Lead</div>
      <div class="perf-intro-text">Your Performance Lead combines two frameworks — your Mindset Lead and your Behavioural Lead. Every chapter draws on both, because the two are always in play at the same time.</div>
    </div>
    <div class="perf-lead-band">
      <div class="perf-lead-eyebrow">Your Performance Lead</div>
      <div class="perf-lead-pills">${cPill} <span style="font-size:.85rem;color:var(--mid);font-weight:500">&amp;</span> ${fPill}</div>
      <div class="perf-lead-text">Your Mindset Lead and Behavioural Lead combined — a lens for understanding your performance and expanding what you're capable of.</div>
    </div>
    <div class="perf-cards">
      <div class="perf-card core-card">
        <div class="perf-card-label">Core</div>
        <div class="perf-card-title">Mindset Lead</div>
        <div class="perf-card-wheel">${cWheel}</div>
        <div class="perf-card-order">${cOrderStr}</div>
        <div class="perf-card-intro">${esc(coreIntro)}</div>
      </div>
      <div class="perf-card flow-card">
        <div class="perf-card-label">Flow</div>
        <div class="perf-card-title">Behavioural Lead</div>
        <div class="perf-card-wheel">${fWheel}</div>
        <div class="perf-card-order">${fOrderStr}</div>
        <div class="perf-card-intro">${esc(flowIntro)}</div>
      </div>
    </div>
    <div class="perf-order-section">
      <div class="perf-order-label">Preference Order</div>
      <div class="perf-order-row-label">Core · Mindset</div>
      <div class="perf-order-gauges">${cGauges}</div>
      <div class="perf-order-row-label">Flow · Behaviour</div>
      <div class="perf-order-gauges">${fGauges}</div>
    </div>
  `);
}

function workWithMePage(fc,cc){
  const unlock=(fc.Unlock||[]).slice(0,5);
  const triggers=(cc['Stress Triggers']||[]).slice(0,5);
  const reb=(fc.Rebalancers||[]).slice(0,4);
  const str=(fc.Strengths||[]).slice(0,5);

  function cell(title,items,ruleClass,titleClass){
    const rows=items.map(s=>`<div class="wwm-item">${esc(s)}</div>`).join('');
    return`<div class="wwm-cell">
      <div class="wwm-cell-rule ${ruleClass||''}"></div>
      <div class="wwm-cell-title ${titleClass||''}">${title}</div>
      ${rows}
    </div>`;
  }

  return page('',`
    <div class="run-hdr"><span>Decode Profile&nbsp;·&nbsp;Confidential</span><span>How to Work with Me</span></div>
    <div class="wwm-hdr">
      <div class="wwm-hdr-title">HOW TO WORK WITH ME</div>
      <div class="wwm-hdr-sub">A guide for colleagues and managers — feel free to share this page</div>
    </div>
    <div class="wwm-grid">
      ${cell('What Brings Out My Best',unlock,'','')}
      ${cell('What to Avoid',triggers,'coral','coral')}
      ${cell('How to Give Me Feedback',reb,'','')}
      ${cell('Where I Contribute Most',str,'indigo','indigo')}
    </div>
  `);
}

function chDivPage(num,leadType){
  const names={1:'Assess',2:'Respond',3:'Sustain'};
  const tags={1:'How you show up at your best — and what can get in the way',2:'How your preferences shape your response to pressure and change',3:'Building and sustaining your performance over the long term'};
  const secs={1:['Strengths','Derailers','Unlock','Rebalancers'],2:['Stress Triggers','Pressure Points','Decision Making','Blind Spot'],3:['Resilience','Drivers','Energisers','Confidence']};
  const cols={1:'ch-teal',2:'ch-coral',3:'ch-indigo'};
  const chips=secs[num].map(s=>`<div class="ch-chip">${s}</div>`).join('');
  return page(`ch-div ${cols[num]}`,`
    <div class="ch-ghost">0${num}</div>
    <div class="ch-eyebrow">Chapter&nbsp; 0${num}</div>
    <div class="ch-name">${names[num]}</div>
    <div class="ch-rule"></div>
    <div class="ch-tagline">${esc(tags[num])}</div>
    <div class="ch-chips">${chips}</div>
  `);
}

function stmtGrid(items,dotCls,icon){
  if(!items||!items.length)return'';
  return`<div class="stmt-grid">${items.map(s=>`<div class="stmt-item"><div class="stmt-dot ${dotCls}">${icon||'·'}</div><span>${esc(s)}</span></div>`).join('')}</div>`;
}


function contentPage(secName,data,chNum){
  const chNames={1:'Assess',2:'Respond',3:'Sustain'};
  const [icon,iconCls]=SEC_ICONS[secName]||['·','teal'];
  const prompt=COACHING_PROMPTS[secName]||'';
  const desc=SEC_DESC[secName]||'';
  const pn=++_pageNum;

  // Sections that have a "select" instruction
  const selectSecs=new Set(['Strengths','Derailers','Unlock','Rebalancers','Stress Triggers','Blind Spot','Drivers']);
  const selectMsgs={
    'Strengths':'Select two or three that feel most true for you right now.',
    'Derailers':'Select two or three that resonate — particularly when you\'re under pressure.',
    'Unlock':'Select two or three to share with your manager or coach.',
    'Rebalancers':'Select two or three to work with during your coaching.',
    'Stress Triggers':'Select two or three that feel most live for you.',
    'Blind Spot':'Select two or three that resonate most.',
    'Drivers':'Select two or three that feel most true for you right now.',
  };
  const instruction=selectSecs.has(secName)?`<div class="sec-instruction">${esc(selectMsgs[secName]||'Select two or three that feel most true for you.')}</div>`:'';

  let body='';
  if(secName==='Rebalancers'){
    body=stmtGrid(data||[],iconCls,icon);
  } else if(secName==='Pressure Points'&&data){
    const cards=(data.warnings||[]).map(w=>`<div class="pp-warn-card"><span style="color:#C87800;flex-shrink:0;margin-top:1px">▲</span><span>${esc(w)}</span></div>`).join('');
    const considers=(data.consider||[]).map(([t,q])=>`<div class="pp-consider"><span class="pp-consider-tag">${esc(t)}</span><span>${esc(q)}</span></div>`).join('');
    body=`<p class="sub-lbl">Under pressure, you may start to:</p><div class="pp-warn-grid">${cards}</div><p class="sub-lbl" style="margin-top:12px">Under pressure, consider:</p>${considers}`;
  } else if(secName==='Decision Making'&&data){
    const qs=(data.questions||[]).map(q=>`<div class="q-item">${esc(q)}</div>`).join('');
    body=`<div class="dm-para">${esc(data.para||'')}</div><p class="sub-lbl">Flex your thinking:</p><div class="q-grid">${qs}</div>`;
  } else if(secName==='Blind Spot'){
    const stmts=Array.isArray(data)?data:(data&&data.statements||[]);
    const bC=data&&data.blindCore;
    const bF=data&&data.blindFlow;
    const bCPill=bC?`<span class="perf-lead-pill" style="background:${CORE_COLORS[bC]}">${esc(bC)}</span>`:'';
    const bFPill=bF?`<span class="perf-lead-pill" style="background:${FLOW_COLORS[bF]}">${esc(bF)}</span>`:'';
    const blindHdr=(bC||bF)?`<div class="blind-spot-hdr">
      <div class="blind-spot-hdr-lbl">Your Blind Spot Lead</div>
      <div class="blind-spot-pills">${bCPill} <span style="color:var(--mid);font-size:.85rem">&amp;</span> ${bFPill}</div>
      <div class="blind-spot-hdr-desc">Your least preferred types — the perspectives you naturally reach for last. The statements below explore how this shows up in practice.</div>
    </div>`:'';
    body=`${blindHdr}<div class="blind-grid">${stmts.map(s=>`<div class="blind-item">${esc(s)}</div>`).join('')}</div>`;
  } else if(secName==='Resilience'&&data){
    const sb=(data.setback||[]).map(s=>`<div class="res-item">${esc(s)}</div>`).join('');
    const su=(data.success||[]).map(s=>`<div class="res-item">${esc(s)}</div>`).join('');
    const pr=(data.proactive||[]).map(s=>`<div class="proactive-item">${esc(s)}</div>`).join('');
    body=`<div class="res-cols"><div class="res-col setback"><div class="res-col-title">Following a setback:</div>${sb}</div><div class="res-col success"><div class="res-col-title">Following a success:</div>${su}</div></div><p class="sub-lbl">To proactively manage your ups and downs:</p>${pr}`;
  } else if(secName==='Energisers'&&data){
    const dr=(data.drains||[]).map(s=>`<div class="drain-item">${esc(s)}</div>`).join('');
    const rc=(data.recharge||[]).map(s=>`<div class="en-item">${esc(s)}</div>`).join('');
    const ex=(data.expand||[]).map(s=>`<div class="en-item">${esc(s)}</div>`).join('');
    body=`<p class="sub-lbl">What may drain you:</p>${dr}<div class="en-cols" style="margin-top:10px"><div class="en-col recharge"><div class="en-col-title">To recharge:</div>${rc}</div><div class="en-col expand"><div class="en-col-title">To expand:</div>${ex}</div></div>`;
  } else if(secName==='Confidence'&&data){
    const sr=(data.sources||[]).map(s=>`<div class="conf-item">${esc(s)}</div>`).join('');
    const ex=(data.expand||[]).map(s=>`<div class="expand-item">${esc(s)}</div>`).join('');
    body=`<div class="voice-box"><div class="voice-lbl">Your inner voice may sound like:</div><div class="voice-text">${esc(data.inner_voice||'')}</div></div><p class="sub-lbl">Natural sources of confidence:</p><div class="conf-grid">${sr}</div><p class="sub-lbl" style="margin-top:10px">To expand your base:</p>${ex}`;
  } else if(secName==='Drivers'&&Array.isArray(data)){
    body=stmtGrid(data,iconCls,icon);
  } else if(Array.isArray(data)){
    body=stmtGrid(data,iconCls,icon);
  }

  const hasPrompt=!!prompt;
  const promptBar=hasPrompt?`<div class="coaching-prompt"><div class="cp-label">Coaching Prompt</div><div class="cp-q">${esc(prompt)}</div></div>`:'';

  return page('',`
    <div class="run-hdr"><span>Decode Profile&nbsp;·&nbsp;Confidential</span><span>Chapter ${chNum}&nbsp;·&nbsp;${chNames[chNum]}</span></div>
    <div class="content-page">
      <div class="sec-header">
        <div class="sec-icon-box ${iconCls}">${icon}</div>
        <div class="sec-hdr-text">
          <div class="sec-title">${esc(secName)}</div>
          <div class="sec-desc">${esc(desc)}</div>
        </div>
      </div>
      ${instruction}
      ${body}
    </div>
    ${promptBar}
    <div class="page-footer"><span>The Coaching Doc Ltd.</span><span style="font-size:.48rem;color:#B0BEC5">Profile narrative generated with AI assistance&nbsp;&middot;&nbsp;Psychometric basis: RST + Big Five research</span><span>Page ${pn}</span></div>
  `);
}

function decodingDecisionsPage(){
  const pn=++_pageNum;
  const coreQs={
    'Composed':'What do I know for certain?',
    'Open':'What possibilities haven\'t I considered yet?',
    'Reserved':'What do I need to think through before committing?',
    'Energised':'What\'s the boldest move available here?'
  };
  const flowQs={
    'Firm':'What outcome am I driving toward?',
    'Logical':'What does the evidence actually say?',
    'Outgoing':'Who should be in this conversation?',
    'Warm':'Who will this affect, and how?'
  };
  const cCards=CORE_TYPES.map(t=>`<div class="dd-card">
    <div class="dd-card-hdr" style="background:${CORE_COLORS[t]}">${esc(t)}</div>
    <div class="dd-card-body">
      <div class="dd-card-q">${esc(coreQs[t]||'')}</div>
      <div class="dd-card-lines"></div>
      <div class="dd-card-lines" style="margin-top:7px"></div>
      <div class="dd-card-lines" style="margin-top:7px"></div>
    </div>
  </div>`).join('');
  const fCards=FLOW_TYPES.map(t=>`<div class="dd-card">
    <div class="dd-card-hdr" style="background:${FLOW_COLORS[t]}">${esc(t)}</div>
    <div class="dd-card-body">
      <div class="dd-card-q">${esc(flowQs[t]||'')}</div>
      <div class="dd-card-lines"></div>
      <div class="dd-card-lines" style="margin-top:7px"></div>
      <div class="dd-card-lines" style="margin-top:7px"></div>
    </div>
  </div>`).join('');
  return page('',`
    <div class="run-hdr"><span>Decode Profile&nbsp;·&nbsp;Confidential</span><span>Chapter 2&nbsp;·&nbsp;Respond</span></div>
    <div class="content-page">
      <div class="sec-header" style="margin-bottom:14px">
        <div class="sec-hdr-text">
          <div class="sec-title" style="font-size:1.4rem;font-weight:900">Decoding Decisions</div>
          <div class="sec-desc" style="font-style:italic">Examine any decision through all eight lenses of the Decode framework. Work through the questions in any order — they surface what your default style might otherwise skip.</div>
        </div>
      </div>
      <div class="dd-section-lbl">Core &middot; Mindset</div>
      <div class="dd-cards">${cCards}</div>
      <div class="dd-section-lbl">Flow &middot; Behaviour</div>
      <div class="dd-cards">${fCards}</div>
    </div>
    <div class="page-footer"><span>The Coaching Doc Ltd.</span><span style="font-size:.48rem;color:#B0BEC5">Profile narrative generated with AI assistance&nbsp;&middot;&nbsp;Psychometric basis: RST + Big Five research</span><span>Page ${pn}</span></div>
  `);
}

function summaryPage(name,lF,lC,fOrder,cOrder){
  const pn=++_pageNum;
  const cPill=`<span class="perf-lead-pill" style="background:${CORE_COLORS[lC]}">${esc(lC)}</span>`;
  const fPill=`<span class="perf-lead-pill" style="background:${FLOW_COLORS[lF]}">${esc(lF)}</span>`;
  const cWheel=pieWheel(CORE_TYPES,CORE_COLORS,lC,210);
  const fWheel=pieWheel(FLOW_TYPES,FLOW_COLORS,lF,210);
  const cOrderStr=cOrder.map(t=>`<span style="color:${t===lC?CORE_COLORS[t]:'#6A7A84'};font-weight:${t===lC?700:400}">${esc(t)}</span>`).join('<span style="color:#9AAAB4"> &middot; </span>');
  const fOrderStr=fOrder.map(t=>`<span style="color:${t===lF?FLOW_COLORS[t]:'#6A7A84'};font-weight:${t===lF?700:400}">${esc(t)}</span>`).join('<span style="color:#9AAAB4"> &middot; </span>');
  return page('',`
    <div class="run-hdr"><span>Decode Profile&nbsp;·&nbsp;Confidential</span><span>Your Profile</span></div>
    <div class="summ-hdr">
      <div class="summ-hdr-eyebrow">Your Profile</div>
      <div class="summ-hdr-name">${esc(name)}</div>
      <div class="summ-hdr-lead-lbl">Performance Lead</div>
      <div class="summ-hdr-pills">${cPill} <span style="font-size:.85rem;color:rgba(255,255,255,.4);font-weight:500">&amp;</span> ${fPill}</div>
      <div class="summ-hdr-desc">Your Performance Lead combines your Mindset Lead (CORE) and your Behavioural Lead (FLOW). Both are always in play.</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 40px 0">
      <div class="summ-section" style="flex:1">
        <div class="summ-sec-hdr core-hdr">
          <div class="summ-sec-eyebrow">Core &middot; Mindset Lead</div>
        </div>
        <div class="summ-sec-body" style="flex:1;flex-direction:column;align-items:center;justify-content:center;padding:20px">
          ${cWheel}
          <div style="margin-top:12px;font-size:.75rem;text-align:center;line-height:2">${cOrderStr}</div>
        </div>
      </div>
      <div class="summ-section" style="flex:1">
        <div class="summ-sec-hdr flow-hdr">
          <div class="summ-sec-eyebrow">Flow &middot; Behavioural Lead</div>
        </div>
        <div class="summ-sec-body" style="flex:1;flex-direction:column;align-items:center;justify-content:center;padding:20px">
          ${fWheel}
          <div style="margin-top:12px;font-size:.75rem;text-align:center;line-height:2">${fOrderStr}</div>
        </div>
      </div>
    </div>
    <div class="page-footer"><span>The Coaching Doc Ltd.</span><span style="font-size:.48rem;color:#B0BEC5">Profile narrative generated with AI assistance&nbsp;&middot;&nbsp;Psychometric basis: RST + Big Five research</span><span>Page ${pn}</span></div>
  `);
}

function backPage(){
  return page('back-page',`
    <div class="cb cb-tl"></div><div class="cb cb-tr"></div>
    <div class="back-art">${nodeArt()}</div>
    <div>
      <div class="back-title">Decode Profile</div>
      <div class="back-copy">&copy; 2026 The Coaching Doc Ltd.&nbsp;&nbsp;All rights reserved.</div>
    </div>
  `);
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function loadProfile(){
  _pageNum=2;
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id){
    document.getElementById('root').innerHTML='<div class="loading-screen"><div>No profile ID in URL.<br><small>Use ?id=PROFILE_ID</small></div></div>';
    return;
  }
  const r=await fetch(`${SB_URL}/rest/v1/profiles?id=eq.${id}&select=*,clients(name,email)`,{headers:H});
  const rows=await r.json();
  if(!rows||!rows.length){
    document.getElementById('root').innerHTML='<div class="loading-screen"><div>Profile not found.</div></div>';
    return;
  }
  const p=rows[0];
  const name=p.clients?.name||'Unknown';
  const lF=p.flow_lead,lC=p.core_lead,secF=p.flow_secondary,secC=p.core_secondary;
  const fOrder=p.flow_order||typeOrder(FLOW_TYPES,lF,secF);
  const cOrder=p.core_order||typeOrder(CORE_TYPES,lC,secC);
  const date=p.report_date||new Date(p.created_at).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const flowIntro=(FLOW_INTROS[lF]||{})[secF]||'';
  const coreIntro=(CORE_INTROS[lC]||{})[secC]||'';
  const fc=FC[lF]||{};
  const cc=CC[lC]||{};

  document.title=`${name} — Decode Profile`;
  document.getElementById('top-bar').style.display='flex';

  const pages=[
    coverPage(name,date),
    perfLeadPage(lF,lC,secF,secC,fOrder,cOrder,flowIntro,coreIntro),
    workWithMePage(fc,cc),
    chDivPage(1,lF),
    contentPage('Strengths',fc.Strengths,1),
    contentPage('Derailers',fc.Derailers,1),
    contentPage('Unlock',fc.Unlock,1),
    contentPage('Rebalancers',fc.Rebalancers,1),
    chDivPage(2,lC),
    contentPage('Stress Triggers',cc['Stress Triggers'],2),
    contentPage('Pressure Points',cc['Pressure Points'],2),
    contentPage('Decision Making',cc['Decision Making'],2),
    decodingDecisionsPage(),
    contentPage('Blind Spot',{statements:cc['Blind Spot'],blindCore:cOrder[3],blindFlow:fOrder[3]},2),
    chDivPage(3,lC),
    contentPage('Resilience',cc.Resilience,3),
    contentPage('Drivers',cc.Drivers,3),
    contentPage('Energisers',cc.Energisers,3),
    contentPage('Confidence',cc.Confidence,3),
    summaryPage(name,lF,lC,fOrder,cOrder),
    backPage(),
  ];

  document.getElementById('root').innerHTML=pages.join('');
}

loadProfile();
</script>
